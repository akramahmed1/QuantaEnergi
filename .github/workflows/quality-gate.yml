name: Quality Gate

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run Python linting
      working-directory: ./apps/backend
      run: |
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Python formatting check
      working-directory: ./apps/backend
      run: |
        black --check --diff app

    - name: Run frontend linting
      working-directory: ./apps/frontend
      run: |
        npm run lint

    - name: Run frontend formatting check
      working-directory: ./apps/frontend
      run: |
        npm run format:check

    - name: Run frontend type checking
      working-directory: ./apps/frontend
      run: |
        npm run type-check

  test-coverage:
    name: Test Coverage Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantaenergi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio pytest-mock

    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run backend tests with coverage
      working-directory: ./apps/backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=95

    - name: Run frontend tests with coverage
      working-directory: ./apps/frontend
      run: |
        npm run test:coverage -- --coverage --watchAll=false --coverageThreshold='{"global":{"branches":95,"functions":95,"lines":95,"statements":95}}'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./apps/backend/coverage.xml,./apps/frontend/coverage/lcov.info
        flags: quality-gate
        name: quality-gate-coverage

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Python security scan
      run: |
        pip install bandit safety
        bandit -r apps/backend/app -f json -o bandit-report.json
        safety check --json --output safety-report.json

    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-scan-results
        path: |
          bandit-report.json
          safety-report.json

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run npm audit
      working-directory: ./apps/frontend
      run: |
        npm audit --audit-level=moderate

    - name: Check for outdated dependencies
      working-directory: ./apps/frontend
      run: |
        npm outdated || true

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [code-quality, test-coverage, security-scan, dependency-check]
    if: always()

    steps:
    - name: Quality Gate Summary
      run: |
        echo "# Quality Gate Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Code Quality" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.code-quality.result }}" == "success" ]; then
          echo "✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Code quality checks failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.test-coverage.result }}" == "success" ]; then
          echo "✅ Test coverage requirements met (≥95%)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Test coverage requirements not met" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Security Scan" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.security-scan.result }}" == "success" ]; then
          echo "✅ Security scan passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Security scan failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Dependency Check" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.dependency-check.result }}" == "success" ]; then
          echo "✅ Dependency check passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Dependency check failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Overall Status" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.code-quality.result }}" == "success" ] && [ "${{ needs.test-coverage.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.dependency-check.result }}" == "success" ]; then
          echo "🎉 All quality gates passed! Ready for merge." >> $GITHUB_STEP_SUMMARY
        else
          echo "🚫 Quality gates failed. Please address the issues before merging." >> $GITHUB_STEP_SUMMARY
        fi
