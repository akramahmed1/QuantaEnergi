name: Performance Tests

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2 AM UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'apps/backend/**'
      - 'tests/performance/**'

env:
  PYTHON_VERSION: '3.12'

jobs:
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantaenergi_perf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run performance benchmarks
      working-directory: ./tests/performance
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_perf
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        python run_benchmarks.py --output results/

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: benchmark-results
        path: tests/performance/results/

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantaenergi_load
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run load tests
      working-directory: ./tests/load
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_load
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        python run_load_tests.py --scenario stress_test --users 500 --spawn-rate 50 --duration 5m

    - name: Upload load test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: load-test-results
        path: tests/load/reports/

  stress-testing:
    name: Stress Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantaenergi_stress
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run stress tests
      working-directory: ./tests/load
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_stress
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        python run_load_tests.py --scenario stress_test --users 1000 --spawn-rate 100 --duration 10m

    - name: Upload stress test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: stress-test-results
        path: tests/load/reports/

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [performance-benchmarks, load-testing, stress-testing]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate performance summary
      run: |
        echo "# Performance Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
        if [ -f "benchmark-results/benchmark_results.json" ]; then
          echo "✅ Performance benchmarks completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Performance benchmarks failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Load Testing" >> $GITHUB_STEP_SUMMARY
        if [ -f "load-test-results/load_test_summary_*.json" ]; then
          echo "✅ Load tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Load tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Stress Testing" >> $GITHUB_STEP_SUMMARY
        if [ -f "stress-test-results/load_test_summary_*.json" ]; then
          echo "✅ Stress tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Stress tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Performance Thresholds" >> $GITHUB_STEP_SUMMARY
        echo "- API Response Time: < 50ms" >> $GITHUB_STEP_SUMMARY
        echo "- Database Query Time: < 10ms" >> $GITHUB_STEP_SUMMARY
        echo "- Concurrent Users: 1000+" >> $GITHUB_STEP_SUMMARY
        echo "- Error Rate: < 0.1%" >> $GITHUB_STEP_SUMMARY
