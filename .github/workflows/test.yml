name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantaenergi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio pytest-mock
        pip install pytest-html pytest-xdist

    - name: Run unit tests
      working-directory: ./apps/backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=test-results/results.xml --html=test-results/report.html

    - name: Run integration tests
      working-directory: ./apps/backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=test-results/integration-results.xml --html=test-results/integration-report.html

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Upload backend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          apps/backend/test-results/
          apps/backend/htmlcov/
          apps/backend/coverage.xml

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Run unit tests
      working-directory: ./apps/frontend
      run: |
        npm run test:coverage -- --coverage --watchAll=false

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Upload frontend test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: frontend-test-results
        path: apps/frontend/coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: npm ci

    - name: Install Playwright browsers
      working-directory: ./apps/frontend
      run: npx playwright install --with-deps

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run E2E tests
      working-directory: ./apps/frontend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        npm run test:e2e

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          apps/frontend/test-results/
          apps/frontend/playwright-report/

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run load tests
      working-directory: ./tests/load
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quantaenergi_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        python run_load_tests.py --scenario normal_load --users 100 --spawn-rate 10 --duration 2m

    - name: Upload load test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: load-test-results
        path: tests/load/reports/

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run OWASP ZAP security scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    - name: Upload security test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: .zap/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, load-tests, security-tests]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate test summary
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Backend Tests" >> $GITHUB_STEP_SUMMARY
        if [ -f "backend-test-results/results.xml" ]; then
          echo "✅ Backend unit tests passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Backend unit tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Frontend Tests" >> $GITHUB_STEP_SUMMARY
        if [ -f "frontend-test-results/lcov.info" ]; then
          echo "✅ Frontend tests passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Frontend tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## E2E Tests" >> $GITHUB_STEP_SUMMARY
        if [ -f "e2e-test-results/results.json" ]; then
          echo "✅ E2E tests passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ E2E tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Load Tests" >> $GITHUB_STEP_SUMMARY
        if [ -f "load-test-results/load_test_summary_*.json" ]; then
          echo "✅ Load tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Load tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Security Tests" >> $GITHUB_STEP_SUMMARY
        if [ -f "security-test-results/report.html" ]; then
          echo "✅ Security tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Security tests failed" >> $GITHUB_STEP_SUMMARY
        fi

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()

    steps:
    - name: Download coverage artifacts
      uses: actions/download-artifact@v3
      with:
        pattern: '*-test-results'
        merge-multiple: true

    - name: Generate coverage report
      run: |
        echo "# Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Backend Coverage" >> $GITHUB_STEP_SUMMARY
        if [ -f "backend-test-results/coverage.xml" ]; then
          echo "✅ Backend coverage report generated" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Backend coverage report missing" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Frontend Coverage" >> $GITHUB_STEP_SUMMARY
        if [ -f "frontend-test-results/lcov.info" ]; then
          echo "✅ Frontend coverage report generated" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Frontend coverage report missing" >> $GITHUB_STEP_SUMMARY
        fi
