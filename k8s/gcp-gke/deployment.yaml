apiVersion: v1
kind: Namespace
metadata:
  name: quantaenergi
  labels:
    name: quantaenergi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantaenergi-backend
  namespace: quantaenergi
  annotations:
    iam.gke.io/gcp-service-account: quantaenergi-backend@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantaenergi-frontend
  namespace: quantaenergi
  annotations:
    iam.gke.io/gcp-service-account: quantaenergi-frontend@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantaenergi-backend
  namespace: quantaenergi
  labels:
    app: quantaenergi-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantaenergi-backend
  template:
    metadata:
      labels:
        app: quantaenergi-backend
    spec:
      serviceAccountName: quantaenergi-backend
      containers:
      - name: backend
        image: gcr.io/PROJECT_ID/quantaenergi-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: quantaenergi-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: quantaenergi-secrets
              key: redis-url
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: GOOGLE_CLOUD_REGION
          value: "us-central1"
        - name: GCS_BUCKET
          value: "quantaenergi-data"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: quantaenergi-config
      nodeSelector:
        cloud.google.com/gke-nodepool: "backend-pool"
---
apiVersion: v1
kind: Service
metadata:
  name: quantaenergi-backend
  namespace: quantaenergi
spec:
  selector:
    app: quantaenergi-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantaenergi-frontend
  namespace: quantaenergi
  labels:
    app: quantaenergi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantaenergi-frontend
  template:
    metadata:
      labels:
        app: quantaenergi-frontend
    spec:
      serviceAccountName: quantaenergi-frontend
      containers:
      - name: frontend
        image: gcr.io/PROJECT_ID/quantaenergi-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "https://api.quantaenergi.com"
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      nodeSelector:
        cloud.google.com/gke-nodepool: "frontend-pool"
---
apiVersion: v1
kind: Service
metadata:
  name: quantaenergi-frontend
  namespace: quantaenergi
spec:
  selector:
    app: quantaenergi-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantaenergi-ingress
  namespace: quantaenergi
  annotations:
    kubernetes.io/ingress.class: gce
    cloud.google.com/load-balancer-type: External
    networking.gke.io/v1beta1.FrontendConfig: quantaenergi-frontend-config
    networking.gke.io/managed-certificates: quantaenergi-ssl-cert
    kubernetes.io/ingress.global-static-ip-name: quantaenergi-ip
spec:
  rules:
  - host: api.quantaenergi.com
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: quantaenergi-backend
            port:
              number: 8000
  - host: app.quantaenergi.com
    http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: quantaenergi-frontend
            port:
              number: 3000
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: quantaenergi-frontend-config
  namespace: quantaenergi
spec:
  sslPolicy: quantaenergi-ssl-policy
---
apiVersion: networking.gke.io/v1beta1
kind: ManagedCertificate
metadata:
  name: quantaenergi-ssl-cert
  namespace: quantaenergi
spec:
  domains:
    - api.quantaenergi.com
    - app.quantaenergi.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantaenergi-config
  namespace: quantaenergi
data:
  app.yaml: |
    database:
      host: quantaenergi-db.REGION.gcp.cloudsql.com
      port: 5432
      name: quantaenergi
      ssl_mode: require
    redis:
      host: quantaenergi-redis.REGION.cache.gcp.com
      port: 6379
      ssl: true
    gcp:
      project_id: PROJECT_ID
      region: us-central1
      gcs_bucket: quantaenergi-data
      cloud_logging: true
    monitoring:
      prometheus_endpoint: http://prometheus:9090
      grafana_endpoint: http://grafana:3000
---
apiVersion: v1
kind: Secret
metadata:
  name: quantaenergi-secrets
  namespace: quantaenergi
type: Opaque
data:
  database-url: <base64-encoded-database-url>
  redis-url: <base64-encoded-redis-url>
  jwt-secret: <base64-encoded-jwt-secret>
  api-keys: <base64-encoded-api-keys>
