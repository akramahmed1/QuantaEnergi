apiVersion: v1
kind: Service
metadata:
  name: quantaenergi-metrics
  namespace: quantaenergi
  labels:
    app: quantaenergi-metrics
spec:
  selector:
    app: quantaenergi-metrics
  ports:
  - name: metrics
    port: 8001
    targetPort: 8001
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantaenergi-metrics
  namespace: quantaenergi
  labels:
    app: quantaenergi-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantaenergi-metrics
  template:
    metadata:
      labels:
        app: quantaenergi-metrics
    spec:
      containers:
      - name: metrics
        image: prom/prometheus:latest
        ports:
        - containerPort: 8001
        env:
        - name: METRICS_PORT
          value: "8001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        persistentVolumeClaim:
          claimName: prometheus-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: quantaenergi
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "alert_rules.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
      - job_name: 'quantaenergi-backend'
        static_configs:
          - targets: ['quantaenergi-backend:8001']
        scrape_interval: 5s
        metrics_path: /metrics
      
      - job_name: 'quantaenergi-frontend'
        static_configs:
          - targets: ['quantaenergi-frontend:8001']
        scrape_interval: 5s
        metrics_path: /metrics
      
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
      
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: quantaenergi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
