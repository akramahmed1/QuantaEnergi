[build]
builder = "NIXPACKS"
buildCommand = "poetry install && poetry run python -m alembic upgrade head"

[deploy]
startCommand = "poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
ENVIRONMENT = "production"
DEBUG = "false"
LOG_LEVEL = "INFO"
HOST = "0.0.0.0"
PORT = "$PORT"
DATABASE_URL = "$DATABASE_URL"
REDIS_URL = "$REDIS_URL"
SECRET_KEY = "$SECRET_KEY"
CORS_ORIGINS = "https://quantaenergi-frontend.vercel.app,https://quantaenergi.vercel.app"

[services]
[services.database]
type = "postgresql"
version = "16"

[services.redis]
type = "redis"
version = "7"
