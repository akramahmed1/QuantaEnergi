apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantaenergi-backend
  namespace: quantaenergi
  labels:
    app: quantaenergi-backend
    component: api
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quantaenergi-backend
  template:
    metadata:
      labels:
        app: quantaenergi-backend
        component: api
        version: v1.0.0
    spec:
      containers:
      - name: quantaenergi-backend
        image: quantaenergi/backend:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: quantaenergi-secrets
              key: jwt-secret
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: quantaenergi-secrets
              key: encryption-key
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quantaenergi-secrets
              key: database-password
        envFrom:
        - configMapRef:
            name: quantaenergi-config
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: models
          mountPath: /app/models
      volumes:
      - name: logs
        emptyDir: {}
      - name: models
        configMap:
          name: quantaenergi-models
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantaenergi-frontend
  namespace: quantaenergi
  labels:
    app: quantaenergi-frontend
    component: web
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantaenergi-frontend
  template:
    metadata:
      labels:
        app: quantaenergi-frontend
        component: web
        version: v1.0.0
    spec:
      containers:
      - name: quantaenergi-frontend
        image: quantaenergi/frontend:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: VITE_API_URL
          value: "https://api.quantaenergi.com"
        - name: VITE_WS_URL
          value: "wss://api.quantaenergi.com/ws"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
