apiVersion: v1
kind: Service
metadata:
  name: quantaenergi-backend-service
  namespace: quantaenergi
  labels:
    app: quantaenergi-backend
    component: api
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: quantaenergi-backend
---
apiVersion: v1
kind: Service
metadata:
  name: quantaenergi-frontend-service
  namespace: quantaenergi
  labels:
    app: quantaenergi-frontend
    component: web
spec:
  type: LoadBalancer
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: quantaenergi-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: quantaenergi
  labels:
    app: postgres
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: quantaenergi
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
